[package]
name = "helios-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "helios_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
serde = { workspace = true }
serde_json = { workspace = true }
# SOLIDWORKS add-in bridge: a small loopback HTTP server (axum on its own tokio
# runtime/thread) + a random per-launch token. See src/bridge/.
axum = "0.7"
tokio = { workspace = true, features = ["net", "time", "sync"] }
reqwest = { workspace = true }
getrandom = "0.2"
helios-core = { path = "../../../crates/helios-core" }
helios-csv = { path = "../../../crates/helios-csv" }
helios-arrow = { path = "../../../crates/helios-arrow" }
engine-sim = { path = "../../../crates/engine-sim" }
cfd-core = { path = "../../../crates/cfd-core" }
pdm-sw-parser = { path = "../../../crates/pdm-sw-parser" }
ulid = "1"
# Native window screenshot for bug reports (captures WebGL/canvas too). Bundles
# the `image` crate, re-exported as `xcap::image`.
xcap = "0.0.14"

# Windows-only: the SOLIDWORKS add-in injector writes per-user (HKCU) registry
# entries (no RegAsm/admin). winreg is a Windows crate, so it must not be pulled
# in on macOS/Linux — the whole addin_injector module is #[cfg(windows)].
[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dev-dependencies]
cfb = { workspace = true }
