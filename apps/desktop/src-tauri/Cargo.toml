[package]
name = "helios-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "helios_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-single-instance = "2"
serde = { workspace = true }
serde_json = { workspace = true }
# SOLIDWORKS add-in bridge: a small loopback HTTP server (axum on its own tokio
# runtime/thread) + a random per-launch token. See src/bridge/.
axum = "0.7"
tokio = { workspace = true, features = ["net", "time", "sync"] }
reqwest = { workspace = true }
getrandom = "0.2"
helios-core = { path = "../../../crates/helios-core" }
helios-csv = { path = "../../../crates/helios-csv" }
helios-arrow = { path = "../../../crates/helios-arrow" }
engine-sim = { path = "../../../crates/engine-sim" }
cfd-core = { path = "../../../crates/cfd-core" }
pdm-sw-parser = { path = "../../../crates/pdm-sw-parser" }
ulid = "1"

[dev-dependencies]
cfb = { workspace = true }
