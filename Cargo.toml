[workspace]
resolver = "2"
members = [
  "crates/helios-core",
  "crates/helios-arrow",
  "crates/helios-csv",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "2.3.0-rc.3"
edition = "2021"
license = "MIT"

[workspace.dependencies]
arrow = "53"
arrow-ipc = "53"
csv = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
anyhow = "1"
