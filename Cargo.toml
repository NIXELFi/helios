[workspace]
resolver = "2"
members = [
  "crates/helios-core",
  "crates/helios-arrow",
  "crates/helios-csv",
  "crates/pdm-core",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "2.5.2"
edition = "2021"
license = "MIT"

[workspace.dependencies]
arrow = "53"
arrow-ipc = "53"
csv = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
