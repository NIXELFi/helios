[package]
name = "helios-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Helios physics agent MCP server (stdio JSON-RPC 2.0). Per spec C11, a convenience skin over helios-bench — the CLI remains canonical."

[[bin]]
name = "helios-mcp"
path = "src/main.rs"

[lib]
name = "helios_mcp"
path = "src/lib.rs"

[dependencies]
helios-bench = { path = "../helios-bench" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["full"] }
anyhow = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"
