[package]
name = "plugin-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Host-side plugin runtime logic: traversal-safe cache paths, plugin:// URI parsing, the plugin CSP. No Tauri runtime so the security-critical tests stay portable."

[dependencies]
# Pure crypto for client-side bundle verification (sha256 + Ed25519). No Tauri,
# so the verify tests stay portable.
sha2 = { workspace = true }
ed25519-dalek = "2"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"
