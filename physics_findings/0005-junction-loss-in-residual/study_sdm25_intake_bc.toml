[run]
config = "crates/engine-sim/python_ref/configs/sdm25.json"
rpm = [6000.0, 7000.0, 8000.0, 9000.0, 10000.0, 11000.0, 12000.0, 13000.0]
cycles = 30
recorded = true
seed = 5000
junction = "characteristic"

[environment]
target_triple = "aarch64-apple-darwin"
rustc_version = "rustc 1.95.0"
rayon_threads = 1
libm_source = "system"

[sweep]
sampler = "lhs"
n_trials = 1
parameters = [
  { name = "intake_junction_borda_carnot", min = 1, max = 1 },
  { name = "intake_junction_loss_coef", min = 1.0, max = 1.0 },
  { name = "exhaust_junction_borda_carnot", min = 0, max = 0 },
  { name = "exhaust_junction_loss_coef", min = 0, max = 0 },
]

[[acceptance]]
metric = "brake_power_kW@10000"
target = 46.5
tolerance = "±15%"
citation = "FSAE-restricted CBR600 dyno midpoint at 10000 RPM"
