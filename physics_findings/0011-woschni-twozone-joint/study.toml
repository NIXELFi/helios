[run]
config = "crates/engine-sim/python_ref/configs/sdm26.json"
rpm = [8000.0, 10000.0, 11000.0, 12000.0]
cycles = 30
recorded = true
seed = 11000
junction = "characteristic"

[environment]
target_triple = "aarch64-apple-darwin"
rustc_version = "rustc 1.95.0"
rayon_threads = 1
libm_source = "system"

[sweep]
sampler = "lhs"
n_trials = 25
parameters = [
  { name = "intake_junction_borda_carnot", min = 1.0, max = 1.0 },
  { name = "intake_junction_loss_coef", min = 1.0, max = 1.0 },
  { name = "restrictor_loss_from_diffuser_geometry", min = 1.0, max = 1.0 },
  { name = "restrictor_cd_mach_k", min = 0.3, max = 0.3 },
  { name = "spark_advance_rpm_slope_deg_per_krpm", min = 1.5, max = 1.5 },
  { name = "duration_rpm_exp", min = 0.4, max = 0.4 },
  { name = "two_zone_enabled", min = 1.0, max = 1.0 },
  { name = "woschni_c1_combustion", min = 1.5, max = 3.0 },
  { name = "woschni_c2_combustion", min = 0.0, max = 0.005 },
]

[[acceptance]]
metric = "brake_power_kW@10000"
target = 41.0
tolerance = "±15%"
citation = "Woschni + two-zone joint recalibration; target FSAE wheel = sim brake × 0.85"
