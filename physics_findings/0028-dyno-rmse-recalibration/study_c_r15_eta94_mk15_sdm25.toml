[run]
config = "crates/engine-sim/python_ref/configs/sdm25.json"
rpm = [4500.0, 5000.0, 5500.0, 6000.0, 6500.0, 7000.0, 7500.0, 8000.0, 8500.0, 9000.0, 9500.0, 10000.0, 10500.0, 11000.0, 11500.0, 12000.0, 12500.0, 13000.0, 13500.0]
cycles = 30
recorded = true
seed = 8000
junction = "characteristic"

[environment]
target_triple = "x86_64-pc-windows-msvc"
rustc_version = "rustc"
rayon_threads = 1
libm_source = "system"

[sweep]
sampler = "lhs"
n_trials = 1
parameters = [
  { name = "intake_junction_borda_carnot", min = 1.0, max = 1.0 },
  { name = "intake_junction_loss_coef", min = 1.0, max = 1.0 },
  { name = "restrictor_loss_from_diffuser_geometry", min = 1.0, max = 1.0 },
  { name = "restrictor_cd_mach_k", min = 0.15, max = 0.15 },
  { name = "spark_advance_rpm_slope_deg_per_krpm", min = 1.5, max = 1.5 },
  { name = "duration_rpm_exp", min = 0.4, max = 0.4 },
  { name = "fmep_c", min = 0.00075, max = 0.00075 },
  { name = "limiter", min = 1.0, max = 1.0 },
  { name = "cfl", min = 0.5, max = 0.5 },
  { name = "intake_lift_flat_top_ramp", min = 0.25, max = 0.25 },
  { name = "exhaust_lift_flat_top_ramp", min = 0.25, max = 0.25 },
  { name = "intake_valve_re_correction_enabled", min = 1.0, max = 1.0 },
  { name = "exhaust_collector_reflection_coef", min = 0.15, max = 0.15 },
  { name = "eta_comb", min = 0.94, max = 0.94 },
]
