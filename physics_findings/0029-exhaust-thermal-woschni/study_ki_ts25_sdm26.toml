[run]
config = "apps/desktop/src-tauri/resources/cfd/configs/sdm26.json"
rpm = [4500.0, 5000.0, 5500.0, 6000.0, 6500.0, 7000.0, 7500.0, 8000.0, 8500.0, 9000.0, 9500.0, 10000.0, 10500.0, 11000.0, 11500.0, 12000.0, 12500.0, 13000.0, 13500.0]
cycles = 30
recorded = true
seed = 8000
junction = "characteristic"

[environment]
target_triple = "x86_64-pc-windows-msvc"
rustc_version = "rustc"
rayon_threads = 1
libm_source = "system"

[sweep]
sampler = "lhs"
n_trials = 1
parameters = [
  { name = "octane_number", min = 98.0, max = 98.0 },
  { name = "knock_tau_scale", min = 2.5, max = 2.5 },
]
