# Finding 0002 — fmep-b-vs-heywood-typical (SDM25 baseline, C10 validation)
#
# Spec C10 two-calibration validation: re-run the fmep_b sweep against the
# SDM25 (4-1 exhaust, 3 L plenum) calibration of the same CBR600 engine.
# Both calibrations are tuned to the same dyno; the verdict should be
# robust across both.

[run]
config = "crates/engine-sim/python_ref/configs/sdm25.json"
rpm = [10000.0]
cycles = 25
recorded = true
seed = 2025
junction = "characteristic"

[environment]
target_triple = "x86_64-pc-windows-gnu"
rustc_version = "rustc 1.95.0 (59807616e 2026-04-14)"
rayon_threads = 1
libm_source = "system"

[sweep]
sampler = "lhs"
n_trials = 5
parameters = [
    { name = "fmep_b", min = 0.04, max = 0.10 },
]

[[acceptance]]
metric = "brake_power_kW"
target = 41.0
tolerance = "±10%"
citation = "physics_findings/references/dyno/cbr600rr-fsae-restricted.csv row rpm=10000 (FSAE published team aggregate, lower bound of 41-52 kW published range)"
