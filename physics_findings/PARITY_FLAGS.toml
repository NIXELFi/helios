# PARITY_FLAGS.toml — opt-in physics flags + their parity-preserving default values.
#
# Spec reference: C5 (parity preservation — pre-merge gate, not periodic sweep).
#
# The pre-commit hook (.githooks/pre-commit) runs the parity test suite with
# every flag listed here at the value listed here. If a finding lands a new
# opt-in flag (a new constitutive model, a new closure switch, a new tuning
# coefficient), the lock manifest MUST include this file AND the flag's default
# MUST be added here at the parity-preserving value. The hook fails any commit
# that introduces an opt-in flag without an entry.
#
# Rules:
#  - Every flag default here MUST reproduce the pre-flag (parity-anchor) behavior
#    bit-exactly. If the default cannot be parity-preserving (e.g., a physics fix
#    we want ON by default), the finding documents why and the parity goldens get
#    regenerated by the doctor (and recorded in this file's commit message).
#  - Adding a flag here without a corresponding implementation that respects it
#    is a bug; the parity test will eventually catch it via the doctor sweep.

[flags]
# AFR-dependent combustion efficiency. Default: off (parity uses RPM-only eta_comb).
# Enabling adds a rich-quench / lean-burn correction to eta_comb based on phi.
# Authority: Heywood Ch 4 Fig 4-3; physics_synthesis.md §2.3.
afr_eta_enabled = false

# Two-zone burned/unburned combustion model. Default: off (parity uses single-zone).
# When on, splits the cylinder into burned + unburned zones with per-zone gamma
# and energy balance.
# Authority: Heywood Ch 9 §9.5; two_zone_results.md.
two_zone_enabled = false

# Flat-top region on the intake valve lift profile (degrees of crank angle).
# 0.0 = pure ramp + parabola (parity). Positive value flattens peak lift.
# Authority: Heywood Ch 6 Fig 6.18; SAE 950618 valve-event papers.
intake_lift_flat_top_ramp = 0.0

# Flat-top region on the exhaust valve lift profile. Same semantics as above.
exhaust_lift_flat_top_ramp = 0.0

# Tumble-driven boost to Wiebe burn rate (multiplies Wiebe 'a' coefficient).
# 0.0 = pure RPM scaling (parity). Positive values shorten burn duration as
# tumble ratio rises.
# Authority: Lumley Ch 4; SAE papers on tumble-flame interaction.
tumble_burn_factor = 0.0

# Chen-Flynn FMEP coefficients. Default values reproduce the legacy fit used in
# the existing parity goldens. Documented here so any retune can be flagged.
# FMEP [bar] = fmep_a + fmep_b * P_max [bar] + fmep_c * (mean piston speed)^2
# Authority: Chen-Flynn 1965; Heywood Ch 13 eq. 13.26.
fmep_a = 0.5
fmep_b = 0.1
fmep_c = 0.003

# Junction inflow loss coefficient (stagnation-pressure drop across a tee at
# inflow side). 0.0 = no loss (parity). Lifting this engages a more realistic
# 3-port acoustic junction.
# Authority: Heywood Ch 14; Winterbone & Pearson "Theory of Engine Manifold Design".
inflow_loss_coef = 0.0

# Woschni heat-transfer convective coefficient. The "1.0" value here is the
# multiplier that, applied to the legacy c1=2.28 baseline, reproduces parity.
# Any retune (e.g., c1=0.7x for race calibration) opens a new finding.
# Authority: Woschni 1967 (SAE 670931) eq. 8.
woschni_c1_scale = 1.0
woschni_c2 = 0.00324
