# Finding 0001 — limiter-revalidation
#
# Phase 0 lifecycle drill (spec §5 0.A second half): re-validate the
# already-VALIDATED `cfg.limiter` wiring fix (commit a05f589, regression-test
# at crates/cfd-core/tests/physics_limiter_check.rs) using the new agent loop.
#
# Acceptance target: imep_bar at SDM26 / characteristic / 10000 RPM / 5 cycles.
# Pinned against the existing parity golden (engine_matrix_sdm26_characteristic_10000_5cyc.json
# cycle 5: imep_bar = 11.194719758081801). Helios-bench's Rust output matches
# the parity-test path bit-exactly, so the LAST-cycle (5) IMEP is the canonical
# reproducible metric.

[run]
config = "crates/engine-sim/python_ref/configs/sdm26.json"
rpm = [10000.0]
cycles = 5
recorded = true
seed = 1
junction = "characteristic"

[environment]
target_triple = "x86_64-pc-windows-gnu"
rustc_version = "rustc 1.95.0 (59807616e 2026-04-14)"
rayon_threads = 1
libm_source = "system"

[[acceptance]]
metric = "imep_bar"
target = 11.194719758081801
tolerance = "±0.1%"
citation = "crates/engine-sim/fixtures/parity/engine_matrix_sdm26_characteristic_10000_5cyc.json cycle 5 (parity golden, validated by crates/engine-sim/tests/parity_engine_matrix.rs::sdm26_characteristic_10000)"
