[run]
config = "crates/engine-sim/python_ref/configs/sdm26.json"
rpm = [8000.0, 10000.0]
cycles = 30
recorded = true
seed = 4001
junction = "stagnation"

[environment]
target_triple = "aarch64-apple-darwin"
rustc_version = "rustc 1.95.0"
rayon_threads = 1
libm_source = "system"

[sweep]
sampler = "lhs"
n_trials = 1
parameters = [
  { name = "intake_junction_loss_coef", min = 0.5, max = 0.5 },
]

[[acceptance]]
metric = "brake_power_kW"
target = 30.5
tolerance = "±20%"
citation = "FSAE-restricted CBR600 at 8000 RPM"
