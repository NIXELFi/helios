[run]
config = "crates/engine-sim/python_ref/configs/sdm26.json"
rpm = [10000.0]
cycles = 30
recorded = true
seed = 13000
junction = "characteristic"

[environment]
target_triple = "aarch64-apple-darwin"
rustc_version = "rustc 1.95.0"
rayon_threads = 1
libm_source = "system"

[sweep]
sampler = "lhs"
n_trials = 1
parameters = [
  { name = "intake_junction_borda_carnot", min = 1.0, max = 1.0 },
  { name = "intake_junction_loss_coef", min = 1.0, max = 1.0 },
  { name = "restrictor_loss_from_diffuser_geometry", min = 1.0, max = 1.0 },
  { name = "restrictor_cd_mach_k", min = 0.3, max = 0.3 },
  { name = "spark_advance_rpm_slope_deg_per_krpm", min = 0.0, max = 0.0 },
  { name = "duration_rpm_exp", min = 0.4, max = 0.4 },
  { name = "cr", min = 13, max = 13 },
  { name = "spark_advance", min = 35, max = 35 },
  { name = "octane_number", min = 95, max = 95 },
]

[[acceptance]]
metric = "knock_integral"
target = 0.5
tolerance = "±50%"
citation = "Livengood-Wu auto-ignition integral, target < 1.0 = no knock"
