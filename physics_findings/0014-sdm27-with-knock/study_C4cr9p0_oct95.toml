[run]
config = "crates/engine-sim/python_ref/configs/sdm26.json"
rpm = [6000.0, 8000.0, 10000.0, 11000.0, 12000.0, 13000.0]
cycles = 30
recorded = true
seed = 14000
junction = "characteristic"

[environment]
target_triple = "aarch64-apple-darwin"
rustc_version = "rustc 1.95.0"
rayon_threads = 1
libm_source = "system"

[sweep]
sampler = "lhs"
n_trials = 1
parameters = [
  { name = "intake_junction_borda_carnot", min = 1.0, max = 1.0 },
  { name = "intake_junction_loss_coef", min = 1.0, max = 1.0 },
  { name = "restrictor_loss_from_diffuser_geometry", min = 1.0, max = 1.0 },
  { name = "restrictor_cd_mach_k", min = 0.3, max = 0.3 },
  { name = "spark_advance_rpm_slope_deg_per_krpm", min = 1.5, max = 1.5 },
  { name = "duration_rpm_exp", min = 0.4, max = 0.4 },
  { name = "bore", min = 0.075, max = 0.075 },
  { name = "stroke", min = 0.03390, max = 0.03390 },
  { name = "runner_length", min = 0.245, max = 0.245 },
  { name = "plenum_volume", min = 0.0015, max = 0.0015 },
  { name = "cr", min = 9.0, max = 9.0 },
  { name = "octane_number", min = 95, max = 95 },
]

[[acceptance]]
metric = "knock_integral"
target = 0.7
tolerance = "±50%"
citation = "SDM27 knock check"
