    # Y axis ("IMU Y Accel" — Y is lateral in the conventional X-forward
    # mounting), and the ECU's own derived value ("ECU Lateral Accel").
    # First-wins picks one; the override UI lets the user re-bind if a
    # different source is preferred. Same pattern for long_g / vert_g.
    aliases: [
      lat_g, "imu.lat_g", "Lat_Accel",
      "Lateral G", "Lat G", "G Force Lat", "GForce Lat",
      "IMU Y Accel", "ECU Lateral Accel",
