# Local-dev config for the telemetry pipeline, standalone flavor.
#
# IMPORTANT OPERATIONAL NOTE — one hosted project, two migration dirs:
# the hosted Supabase project is the SAME one infra/pdm-supabase links to
# (Vault/PM/Games live there). The supabase CLI tracks one migration history
# per project, so applying these migrations to hosted from this directory
# will conflict with the pdm history. The intended hosted apply path is:
#   1. copy infra/telemetry-supabase/supabase/migrations/*.sql into
#      infra/pdm-supabase/supabase/migrations/ (timestamps already sort after
#      every pdm migration), then `supabase db push` from pdm-supabase; or
#   2. apply via psql directly and `supabase migration repair`.
# Decide in the next session; authoring home stays here either way.
#
# For S5 (Vault canary under load) local testing, run the combined stack from
# infra/pdm-supabase with these migrations copied in, so pdm + telemetry
# coexist exactly as they will on hosted.

project_id = "telemetry-supabase"

[api]
enabled = true
port = 54331
# `telemetry` must be exposed for PostgREST web reads (Helios Lite path).
# On hosted: Dashboard -> Settings -> API -> Exposed schemas: add `telemetry`.
schemas = ["public", "graphql_public", "telemetry"]
extra_search_path = ["public", "extensions", "telemetry"]
max_rows = 1000

[db]
port = 54332
shadow_port = 54330
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54333
api_url = "http://127.0.0.1"

[inbucket]
enabled = false

[storage]
enabled = true
file_size_limit = "200MiB"

[storage.buckets.telemetry-sessions]
public = false
file_size_limit = "200MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:5174"
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8084
deno_version = 2

[analytics]
enabled = false
