name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag (e.g. v2.3.0-rc.1)"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    # Expose the resolved release tag (from push.tags or workflow_dispatch
    # input) so downstream jobs can gate on the *tag*, not `github.ref_name`
    # — which on `workflow_dispatch` is the branch name and would let manual
    # dispatches of "v3.0.7-rc.1" auto-publish (audit 2026-05-11).
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    strategy:
      fail-fast: false
      # Builds run in PARALLEL. The old race — tauri-action's per-job latest.json
      # read-modify-write clobbering each other's platform keys under concurrency,
      # so Apple Silicon Macs + Linux went "offline" — is gone: NO build job writes
      # latest.json now (tauri-action runs with uploadUpdaterJson:false). Each job
      # instead emits only ITS OWN platform's {signature,bundle} fragment, and the
      # single `updater` job assembles the complete manifest once, after all builds,
      # uploading it before `publish` un-drafts the release. Back to ~15 min with a
      # deterministic, single-writer latest.json. (See scripts/updater-fragment.mjs
      # + scripts/assemble-updater-json.mjs.)
      matrix:
        include:
          # macOS gets two matrix entries — one per arch — instead of a single
          # `universal-apple-darwin` build. tauri-action's docs explicitly note
          # universal is incompatible with the updater (it only emits a .dmg
          # for first install and no signed .app.tar.gz for the updater
          # payload), which leaves macOS missing from latest.json. Building
          # per-arch produces a signed .app.tar.gz for each, which become the
          # darwin-aarch64 / darwin-x86_64 fragments (and platform keys).
          - platform: macos-aarch64
            runner: macos-14
            rust-target: aarch64-apple-darwin
            tauri-args: "--target aarch64-apple-darwin"
            updater-target: darwin-aarch64
          - platform: macos-x64
            runner: macos-14
            rust-target: x86_64-apple-darwin
            tauri-args: "--target x86_64-apple-darwin"
            updater-target: darwin-x86_64
          - platform: windows
            runner: windows-latest
            rust-target: ""
            tauri-args: ""
            updater-target: windows-x86_64
          - platform: linux
            runner: ubuntu-22.04
            rust-target: ""
            tauri-args: ""
            updater-target: linux-x86_64

    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version tag
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        # Version intentionally not specified here — the action picks it up
        # from package.json's "packageManager" field. Setting both is an error
        # in pnpm/action-setup@v4 (ERR_PNPM_BAD_PM_VERSION).
        uses: pnpm/action-setup@v4

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Virtual workspace: a single shared target/ at the root, so cache
          # the root rather than per-member paths. Listing only some members
          # caused cache misses on pdm-* crates (audit 2026-05-11).
          workspaces: .

      - name: Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Verify versions match the tag
        env:
          GITHUB_REF_NAME: ${{ steps.version.outputs.tag }}
        run: node scripts/check-versions.mjs

      # The C# binaries (HeliosVault.dll add-in, HeliosShell.dll + SharpShell.dll
      # Explorer ext, HeliosSwReadonly.exe helper) are NOT built here — they ship
      # from committed apps/desktop/src-tauri/resources/. Fail loudly + audit the
      # shipped bytes (sha256) if any is missing/empty. See the script header and
      # apps/desktop/src-tauri/resources/README.md for the rebuild-before-tag step.
      - name: Verify bundled resources present
        run: node scripts/check-bundled-resources.mjs

      - name: Typecheck
        # Release previously skipped typecheck entirely, so type-broken code
        # could ship from a tag push even though CI gates PRs on it
        # (audit 2026-06-09). Cheap relative to the build below.
        run: pnpm typecheck

      - name: Run Rust tests
        run: cargo test --workspace --locked

      - name: Run TS tests
        # @helios/pdm-supabase is filtered out: needs a real Supabase backend
        # and credentials (SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY). To run
        # it here, wire those as repo secrets, surface them in this step's
        # env block, and remove the filter (and the matching one in ci.yml).
        run: pnpm -r --workspace-concurrency=1 --filter '!@helios/pdm-supabase' test

      - name: Build + sign + upload
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          # GITHUB_TOKEN is required by tauri-action to upload the built
          # artifacts to the release. Without it, the build succeeds and
          # signs cleanly but the upload step exits with
          # "##[error]GITHUB_TOKEN is required".
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # NOTE: the app no longer bakes in a Supabase connection at build
          # time. Each user enters their own Supabase URL + anon key in-app
          # (auth modal → Connect step), persisted locally. There is no
          # VITE_SUPABASE_* injection here on purpose — the shipped binary
          # is decoupled from any specific Supabase project.
        with:
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: "Helios ${{ steps.version.outputs.tag }}"
          releaseBody: |
            See [v2_changes/](https://github.com/NIXELFi/helios/tree/${{ steps.version.outputs.tag }}/v2_changes/) for the running log.
            First-install instructions: [docs/INSTALL.md](https://github.com/NIXELFi/helios/blob/${{ steps.version.outputs.tag }}/docs/INSTALL.md).
          releaseDraft: true
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
          projectPath: apps/desktop
          args: ${{ matrix.tauri-args }}
          updaterJsonPreferNsis: true
          # Do NOT let each parallel job write latest.json — that read-modify-write
          # is exactly the race this design removes. The `updater` job assembles it
          # once below. The platform bundles + .sig are still uploaded as assets.
          uploadUpdaterJson: false

      # Emit this platform's slice of the updater manifest from its OWN build
      # output, so the single assembler job never has to guess filenames across
      # platforms/arches.
      - name: Write updater manifest fragment
        shell: bash
        env:
          TARGET: ${{ matrix.updater-target }}
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: node scripts/updater-fragment.mjs

      - name: Upload updater fragment
        uses: actions/upload-artifact@v4
        with:
          name: updater-fragment-${{ matrix.updater-target }}
          path: fragment.json
          if-no-files-found: error
          retention-days: 1

  updater:
    name: Assemble updater manifest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download updater fragments
        uses: actions/download-artifact@v4
        with:
          pattern: updater-fragment-*
          path: fragments

      # Single writer: build the complete latest.json from every platform's
      # fragment and (re)upload it to the (still-draft) release. Runs after all
      # builds and before `publish`, so the release is never un-drafted with a
      # missing/partial manifest. If this fails, `publish` is skipped and the
      # release stays a draft for inspection.
      - name: Assemble + upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          FRAG_DIR: fragments
        run: |
          node scripts/assemble-updater-json.mjs
          gh release upload "$RELEASE_TAG" latest.json --clobber

  publish:
    name: Publish release
    needs: [build, updater]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The GitHub release body is sourced from CHANGELOG.md — the single source
      # of truth for release notes (see CHANGELOG.md's header comment and
      # scripts/extract-changelog.mjs). Runs for EVERY release (incl. RC drafts)
      # so the release always carries its notes. check-versions.mjs (build job)
      # already failed the release if this section was missing.
      - name: Set release notes from CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        shell: bash
        run: |
          NOTES="$(node scripts/extract-changelog.mjs "$RELEASE_TAG")"
          {
            echo "$NOTES"
            echo ""
            echo "---"
            echo "First-install instructions: [docs/INSTALL.md](https://github.com/NIXELFi/helios/blob/${RELEASE_TAG}/docs/INSTALL.md)."
          } > release-notes.md
          gh release edit "$RELEASE_TAG" --notes-file release-notes.md

      - name: Promote draft release to published
        # Auto-publish only for stable releases (no `-rc`, `-beta`, etc. in the
        # *resolved tag*). Using needs.build.outputs.tag rather than
        # github.ref_name so workflow_dispatch (where ref_name is the branch)
        # correctly gates on the input tag.
        if: ${{ !contains(needs.build.outputs.tag, '-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: gh release edit "${RELEASE_TAG}" --draft=false

      # Announce stable releases in the team Slack channel. The webhook is a
      # Slack Workflow Builder trigger that expects a single string variable
      # named "text". The URL lives ONLY in the SLACK_RELEASE_WEBHOOK repo secret
      # — never hardcoded in this file. Skips cleanly if the secret is unset.
      - name: Notify Slack
        if: ${{ !contains(needs.build.outputs.tag, '-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_RELEASE_WEBHOOK }}
        shell: bash
        run: |
          if [ -z "$SLACK_WEBHOOK" ]; then
            echo "SLACK_RELEASE_WEBHOOK not set — skipping Slack notification."
            exit 0
          fi
          URL="$(gh release view "$RELEASE_TAG" --json url -q .url)"
          # Slack Workflow Builder inserts the `text` variable literally (no
          # markdown), so emit clean PLAIN TEXT rather than the raw GFM changelog.
          TEXT="$(node scripts/format-slack-notes.mjs "$RELEASE_TAG" "$URL")"
          jq -n --arg text "$TEXT" '{text: $text}' \
            | curl -sf -X POST -H 'Content-type: application/json' -d @- "$SLACK_WEBHOOK"
