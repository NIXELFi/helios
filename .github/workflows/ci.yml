name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # Cancel superseded PR runs; for main pushes, group by sha so each push runs.
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Typecheck + JS/TS tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        # Version intentionally not specified — picked up from package.json's
        # "packageManager" field. Setting both is an error in pnpm/action-setup@v4.
        uses: pnpm/action-setup@v4

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      # CI never rebuilds the committed C# binaries (no SOLIDWORKS / dotnet on the
      # runner). Catch a missing/empty bundled DLL early; the release workflow
      # runs the same check as a release gate.
      - name: Verify bundled resources present
        run: node scripts/check-bundled-resources.mjs

      - name: Typecheck
        run: pnpm typecheck

      - name: Run TS tests
        # Serial across workspaces because some packages share fixture
        # filesystems / ports during integration runs. Matches release.yml.
        #
        # @helios/pdm-supabase is filtered out HERE because it needs a real
        # database — the dedicated pdm-security-tests job below runs it
        # against a local Supabase stack on every PR/push.
        run: pnpm -r --workspace-concurrency=1 --filter '!@helios/pdm-supabase' test

  pdm-security-tests:
    # The Vault's RLS / RPC / storage-policy suite (infra/pdm-supabase/tests)
    # is the only thing standing between an authorization regression and
    # production — it MUST run in CI, not just on contributors' machines.
    # Runs the full migration set + suite against a throwaway local Supabase
    # stack (Docker is preinstalled on ubuntu runners).
    name: Vault RLS/RPC security tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/pdm-supabase
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Install JS deps
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # "latest" tracks the CLI the team runs locally; the stack version
          # itself is pinned by infra/pdm-supabase/supabase/config.toml.
          version: latest

      - name: Start local Supabase stack (applies all migrations)
        run: supabase start

      - name: Enable the test-reset guard flag
        # pdm.test_reset() (the suite's beforeEach wipe) refuses to run unless
        # the database is explicitly marked as a test environment — see
        # migration 20260511001200. Must run as supabase_admin (the stack's
        # `postgres` user lacks ALTER DATABASE … SET rights for custom GUCs);
        # PostgREST only picks the setting up on restart.
        run: |
          docker exec -e PGPASSWORD=postgres \
            $(docker ps --format '{{.Names}}' | grep _db_) \
            psql -U supabase_admin -d postgres -h 127.0.0.1 \
            -c "ALTER DATABASE postgres SET app.environment = 'test';"
          docker restart $(docker ps --format '{{.Names}}' | grep _rest_)
          sleep 3

      - name: Run the suite (must run, not skip)
        # test:run invokes vitest directly — unlike `test` (test-or-skip.cjs)
        # it CANNOT silently skip, so missing env here fails loudly.
        run: |
          eval $(supabase status -o env | grep -E "^(API_URL|SERVICE_ROLE_KEY|ANON_KEY)=")
          SUPABASE_URL="$API_URL" \
          SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          SUPABASE_ANON_KEY="$ANON_KEY" \
          pnpm test:run

  cargo-test:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Linux dependencies
        # Required for the tauri crate (webkit + gtk) to compile under cargo
        # test against the workspace. Mirror release.yml's list.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Virtual workspace: a single shared target/ at the root, so cache
          # the root rather than per-member paths (which would miss).
          workspaces: .

      - name: Run Rust tests
        run: cargo test --workspace --locked
